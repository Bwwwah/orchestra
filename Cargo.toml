[package]
name = "orchestra"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.10"
dirs = "7.0.0"
eframe = "0.37.0"
hkdf = "0.12"
portable-pty = "0.9"
sys-locale = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
spake2 = "0.4"
uuid = { version = "1.29.3", features = ["v4"] }
vt100 = "0.18"

[dev-dependencies]
egui_kittest = "0.37"


[profile.release]
lto = "thin"
codegen-units = 4
strip = true
