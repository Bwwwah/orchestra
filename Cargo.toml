[package]
name = "orchestra"
version = "0.1.0"
edition = "2024"
description = "Tableau de bord de projets IA : vos projets, vos sessions Claude Code / Codex et leur orchestration"
license = "MIT"

[dependencies]
chacha20poly1305 = "0.10"
dirs = "7.0.0"
eframe = "0.37.0"
hkdf = "0.12"
portable-pty = "0.9"
# Reads RTK's database of savings (src/rtk_stats.rs); bundled: no SQLite needed on the machine.
rusqlite = { version = "0.32", features = ["bundled"] }
sys-locale = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
spake2 = "0.4"
uuid = { version = "1.29.3", features = ["v4"] }
vt100 = "0.18"

[dev-dependencies]
egui_kittest = "0.37"
# The app icons are made from assets/logo-source.png by `cargo run --example icons`
# (the same crate eframe already uses to read PNG files).
image = { version = "0.25", default-features = false, features = ["png"] }


[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Linux package (cargo deb), built by the release workflow.
[package.metadata.deb]
maintainer = "Orchestra"
section = "utils"
priority = "optional"
# DejaVu Sans draws the arrows and symbols the other fonts lack (src/app.rs, setup_fonts).
depends = "$auto, fonts-dejavu-core"
assets = [
    ["target/release/orchestra", "usr/bin/", "755"],
    ["packaging/orchestra.desktop", "usr/share/applications/", "644"],
    ["assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/orchestra.png", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/orchestra.png", "644"],
    # RTK (rtk-oss, Apache-2.0, without its BUSL engine), made by packaging/build-rtk.sh.
    ["target/rtk/x86_64-unknown-linux-gnu/rtk", "usr/lib/orchestra/rtk", "755"],
    ["packaging/licenses/LICENCES-TIERCES.txt", "usr/share/doc/orchestra/", "644"],
    ["packaging/licenses/rtk-LICENSE.txt", "usr/share/doc/orchestra/", "644"],
]
