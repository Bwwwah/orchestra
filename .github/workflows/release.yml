# Builds Orchestra for macOS, Windows and Linux when a version tag (v1.2.3) is pushed —
# which is what "Publier une version" does — and attaches the three files to the GitHub
# release of that tag. Also runs the tests on every push to main.
name: Versions

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev fonts-dejavu-core
      - run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          cargo test --release

  build:
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    env:
      # The app checks this repository's releases for updates.
      ORCHESTRA_UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          perl -0pi -e 's/^version = "[^"]*"/version = "'"$v"'"/m' Cargo.toml
          grep -m1 '^version' Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: macOS (app universelle, .dmg et .zip)
        if: matrix.name == 'macOS'
        env:
          # Always the same signing certificate, so that macOS keeps the app's permissions
          # (Screen Recording…) after an update. Without these secrets: ad-hoc signature,
          # with a warning. See packaging/sign-macos.sh and docs/permissions-macos.md.
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          # Notarization by Apple (Developer ID): see packaging/notarize-macos.sh.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # The secrets are in place: a release must never ship ad-hoc signed.
          MACOS_REQUIRE_IDENTITY: "1"
        run: |
          sh packaging/build-macos.sh
          mkdir -p out
          # .dmg to install (drag onto Applications), .zip for the app's own updates.
          cp dist/*.dmg out/Orchestra-${GITHUB_REF_NAME}-macOS.dmg
          cp dist/*.zip out/Orchestra-${GITHUB_REF_NAME}-macOS.zip

      - name: Windows (installateur .exe, .exe portable et .zip)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          # The icon inside orchestra.exe itself (Explorer, taskbar, shortcuts), from
          # assets/icon.ico (made by `cargo run --example icons`).
          choco install rcedit -y --no-progress
          rcedit target/release/orchestra.exe --set-icon assets/icon.ico
          New-Item -ItemType Directory -Force out | Out-Null
          $tag = $env:GITHUB_REF_NAME
          Copy-Item target/release/orchestra.exe "out/Orchestra-$tag-Windows-portable.exe"
          Compress-Archive -Path target/release/orchestra.exe -DestinationPath "out/Orchestra-$tag-Windows.zip"

      - name: Windows installer (Inno Setup)
        if: matrix.name == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DSourceExe=$PWD\target\release\orchestra.exe" "/DOutDir=$PWD\out" packaging\orchestra.iss

      - name: Linux (.deb et .tar.gz)
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
          cargo build --release
          # RTK (rtk-oss, Apache-2.0, without its BUSL engine) next to the program.
          sh packaging/build-rtk.sh x86_64-unknown-linux-gnu
          mkdir -p out/orchestra && cp target/release/orchestra out/orchestra/
          cp target/rtk/x86_64-unknown-linux-gnu/rtk out/orchestra/rtk
          cp packaging/licenses/LICENCES-TIERCES.txt packaging/licenses/rtk-LICENSE.txt out/orchestra/
          tar -C out -czf out/Orchestra-${GITHUB_REF_NAME}-Linux.tar.gz orchestra
          cargo install cargo-deb --locked
          cargo deb --no-build --output out/Orchestra-${GITHUB_REF_NAME}-Linux.deb || echo "paquet .deb non fabriqué"

      # Checksums of the files the app installs by itself (.zip, .tar.gz): it refuses an
      # update whose SHA-256 doesn't match "<file>.sha256".
      - name: Empreintes SHA-256
        shell: bash
        run: |
          cd out
          for f in *.zip *.tar.gz; do
            [ -f "$f" ] || continue
            h=$( (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") | cut -d' ' -f1)
            printf '%s  %s\n' "$h" "$f" > "$f.sha256"
          done
          ls -l

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.sha256
            out/*.dmg
            out/*.zip
            out/*.exe
            out/*.deb
            out/*.tar.gz
